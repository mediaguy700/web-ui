// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "33.0.0"
        minSdkVersion = 21
        compileSdkVersion = 33
        targetSdkVersion = 33
        kotlinVersion = "1.7.20"

        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "23.1.7779620"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2")
        // React Native Gradle plugin is included via includeBuild in settings.gradle
        // No version needed when using includeBuild
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        maven {
            url 'https://api.mapbox.com/downloads/v2/releases/maven'
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                username = 'mapbox'
                def token = project.findProperty('MAPBOX_DOWNLOADS_TOKEN') ?: System.getenv('MAPBOX_DOWNLOADS_TOKEN')
                password = (token != null && token.toString().trim().length() > 0) ? token.toString() : ''
            }
        }
        // MapsIndoors Maven repository
        maven {
            url 'https://maven.mapsindoors.com/'
        }
        // Sonatype snapshots (for MapsIndoors snapshots)
        maven {
            url 'https://oss.sonatype.org/content/repositories/snapshots/'
        }
    }
    
    configurations.all {
        resolutionStrategy {
            // Force all Kotlin dependencies to use 1.7.20 to match Gradle 7.6.3
            force("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")
            force("org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion")
            force("org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion")
            force("org.jetbrains.kotlin:kotlin-stdlib-common:$kotlinVersion")
            
            // Force appcompat to 1.6.1 (compatible with compileSdkVersion 33)
            // appcompat 1.7.0 requires compileSdkVersion 34
            force("androidx.appcompat:appcompat:1.6.1")
            force("androidx.appcompat:appcompat-resources:1.6.1")
            
            // Force androidx.core to 1.12.0 (compatible with compileSdkVersion 34 and AGP 7.4.2)
            // core 1.16.0 requires compileSdkVersion 35 and AGP 8.6.0
            force("androidx.core:core:1.12.0")
            force("androidx.core:core-ktx:1.12.0")
            
            // Force error_prone_annotations to older version to avoid D8 NullPointerException
            // error_prone_annotations 2.38.0 triggers D8 4.0.52 bug
            force("com.google.errorprone:error_prone_annotations:2.18.0")
        }
    }
    
    // Configure Kotlin JVM target for all subprojects
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "11"
        }
    }
}
